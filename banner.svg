<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 190" width="100%" height="190">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#222b40"/>
    </linearGradient>

    <!-- Warm Accent Gradient for Glow & Border -->
    <linearGradient id="warmAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Subtle radial ambient glow -->
    <radialGradient id="ambientGlow" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#141824" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
    .tagline { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 400; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #fbbf24; letter-spacing: 0.8px; text-transform: uppercase; }
    .pill-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #e2e8f0; }
  </style>

  <!-- Background Card -->
  <rect width="850" height="190" rx="14" fill="url(#bgGrad)"/>
  <rect width="850" height="190" rx="14" fill="url(#ambientGlow)"/>

  <!-- Top Accent Highlight Bar -->
  <rect x="0" y="0" width="850" height="3.5" rx="2" fill="url(#warmAccent)"/>

  <!-- Border Outline -->
  <rect x="0.5" y="0.5" width="849" height="189" rx="13.5" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Header Badge: Academic Focus -->
  <g transform="translate(42, 28)">
    <rect width="210" height="22" rx="11" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="12" cy="11" r="3.5" fill="#f59e0b"/>
    <text x="23" y="15" class="badge-text">B.Tech AI &amp; ML · 2nd Year</text>
  </g>

  <!-- Main Name & Identity -->
  <text x="42" y="85" class="title">Deepak Pradhan</text>

  <!-- Subtitle / Mission Statement -->
  <text x="42" y="112" class="tagline">Exploring Artificial Intelligence, Machine Learning, and building practical applications.</text>

  <!-- Key Competencies Pills -->
  <g transform="translate(42, 136)">
    <!-- Pill 1: Applied ML -->
    <g transform="translate(0, 0)">
      <rect width="168" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
      <text x="12" y="17" class="pill-text">🧠 Applied Machine Learning</text>
    </g>

    <!-- Pill 2: Python Development -->
    <g transform="translate(180, 0)">
      <rect width="162" height="26" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.35"/>
      <text x="12" y="17" class="pill-text">🐍 Python &amp; Data Science</text>
    </g>

    <!-- Pill 3: Interactive Applications -->
    <g transform="translate(354, 0)">
      <rect width="186" height="26" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.35"/>
      <text x="12" y="17" class="pill-text">🚀 Practical Web Applications</text>
    </g>

    <!-- Pill 4: Open to Internships -->
    <g transform="translate(552, 0)">
      <rect width="184" height="26" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1" stroke-opacity="0.35"/>
      <text x="12" y="17" class="pill-text">💼 Open to Tech Internships</text>
    </g>
  </g>
</svg>
